name: Desktop platform checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      WAYGROUND_TEST_BROWSER_CHANNEL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Run unit and UI checks
        run: python -m unittest discover -s tests
      - name: Check desktop startup
        run: python src/main.py --gui-smoke scratch/platform-smoke
      - name: Check automation in a local browser
        run: python tests/browser_desktop_check.py
